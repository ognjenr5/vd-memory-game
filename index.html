<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igra memorije</title>

    <script src="bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="bootstrap.min.css">
    <script src="jquery-4.0.0.min.js"></script>

    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="main-page">
    <div class="cont background">
        <div class="main">
            <div class="header text-center">
                <h1 class="display-1">
                    Igra memorije
                </h1>
                <p>
                    Testiraj svoje pamcenje i brzinu!
                </p>
                <p>
                    Izaberi jedan od dva rezima i igraj igru memorije.
                </p>
            </div>
            <hr>
            <div class="btns">
                <div class="btn-cont">
                    <h5>Rezim:</h5>
                    <button class="mode selected-mode" id="classic">Klasican rezim</button>
                    <h6>Pronadji sve parove kartica u sto manjem broju poteza.</h6>
                </div>
                <div class="btn-cont">
                    <button class="mode" id="timed">Vremenski rezim</button>
                    <h6>Za ograniceno vreme pronadji sve parove kartica.</h6>
                </div>
            </div>
            <hr>
            <div class="btns">
                <div class="btn-cont">
                    <h5>Nivo:</h5>
                    <select name="lvl" id="lvl">
                        <option value="1">Lako</option>
                        <option value="2" selected>Srednje</option>
                        <option value="3">Tesko</option>
                    </select>
                </div>
            </div>
            <hr>
            <div class="btns">
                <div class="btn-cont">
                    <button id="start">Igraj!</button>
                </div>
                <div class="btn-cont">
                    <button id="openScores">Prikazi tabelu rezultata</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
