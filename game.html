<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igra memorije</title>

    <script src="bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="bootstrap.min.css">
    <script src="jquery-4.0.0.min.js"></script>

    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="game-page">
    <div class="background">
        <div class="game-header">
            <div class="game-header-cont">
                <a href="./index.html">↞</a>
            </div>
            <div class="game-header-cont">
                <div class="level-info">
                    <span>Težina:</span>
                    <span id="span-level"></span>
                </div>
                <div>
                    <span>|</span>
                </div>
                <div class="mode-info">
                    <span id="span-mode-info"></span>
                    <span id="span-mode"></span>
                </div>
            </div>
        </div>
        <div class="picture-grid">
        </div>
        <div class="end-game hidden-end">
            <div class="end-cont">
                <span class="status-game"></span>
                <span class="add-score"></span>
                <div class="input-cont" id="addScoreDiv">
                    <input type="text" name="name" id="name" placeholder="Vaše ime" maxlength="3" pattern="[A-Z]{3}">
                    <button id="addToScore">Dodaj</button>
                </div>
                <div class="input-cont" id="playAgainDiv">
                    <button id="playAgain">Igrajte ponovo?</button>
                </div>
                <div class="input-cont">
                    <button id="returnToStart">Vrati se na početnu</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
